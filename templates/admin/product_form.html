{% extends 'admin/base.html' %}

{% block title %}{{ 'Edit' if product else 'Add' }} Product{% endblock %}
{% block header_title %}{{ 'Edit Product' if product else 'Add New Product' }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Product Name</label>
                        <input type="text" name="name" class="form-control" required value="{{ product.name if product else '' }}">
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Category</label>
                            <input type="text" name="category" class="form-control" required value="{{ product.category if product else '' }}" placeholder="e.g. Electronics">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Price ($)</label>
                            <input type="number" step="0.01" name="price" class="form-control" required value="{{ product.price if product else '0.00' }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Stock Qty</label>
                            <input type="number" name="stock_quantity" class="form-control" required value="{{ product.stock_quantity if product else '0' }}">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea name="description" class="form-control" rows="4">{{ product.description if product else '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('admin.list_products') }}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">
                            {{ 'Save Changes' if product else 'Create Product' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
