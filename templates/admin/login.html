<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - OmniCart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center;}
        .login-card { max-width: 400px; width: 100%; border: none; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 2rem;}
    </style>
</head>
<body>
    <div class="login-card bg-white">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">OmniCart Admin</h3>
            <p class="text-muted text-sm">Sign in to manage your store</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} text-sm py-2" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Email Address</label>
                <input type="email" name="email" class="form-control p-2" required placeholder="admin@store.com">
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">Password</label>
                <input type="password" name="password" class="form-control p-2" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold p-2">Login</button>
        </form>
    </div>
</body>
</html>
