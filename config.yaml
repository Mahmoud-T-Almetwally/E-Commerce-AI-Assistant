# config.yaml

database_config:
  url: "sqlite:///instance/ecommerce.db"
  chroma_persist_directory: "./instance/chroma_db"
  echo_queries: false

system_context:
  company_name: "Nexus Commerce"
  tone: "Friendly, helpful, and concise"

llm_config:
  provider: "openai"
  model_name: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 1000

embedding_config:
  provider: "openai"
  model_name: "text-embedding-3-small"