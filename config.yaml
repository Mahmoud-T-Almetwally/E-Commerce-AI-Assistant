flask_config:
  debug: true
  host: "0.0.0.0"
  port: 5000

database_config:
  url: "sqlite:///instance/ecommerce.db"
  chroma_persist_directory: "./instance/chroma_db"
  echo_queries: false
  connect_args:
    check_same_thread: false

system_context:
  company_name: "Nexus Commerce"
  tone: "Friendly, helpful, and concise"

llm_config:
  provider: "openai"
  model_name: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 1000

embedding_config:
  provider: "local"
  model_name: "nomic-embed-text"

meta_config:
  enabled: false

rag_config:
  collection_name: "ecommerce_knowledge"
  max_file_size_mb: 10
  max_content_chars: 200000
  supported_extensions: [".txt", ".pdf", ".docx"]
  chunk_size: 1000
  chunk_overlap: 200